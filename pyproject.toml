# you_only_live_twice — PROJECT BOND film package (VOLCANO)
# Mission codename VOLCANO, from the 1967 bond film "You Only Live Twice".
# Special-agent mission software: space-capsule rendezvous/intercept windows,
# concealed-lair detection, and base pattern-of-life analysis.
# Standalone package repo (github.com/docxology/bond-you_only_live_twice):
# commits go to main, path-scoped.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "you_only_live_twice"
version = "0.1.0"
license = {text = "MIT"}
description = "VOLCANO — special-agent mission software: orbital rendezvous windows, concealed-lair detection, pattern-of-life analysis"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "bond-api",
    "numpy>=2.0.0",
    "matplotlib>=3.10.0",
    "pyyaml>=6.0",
]

# bond-api is the FROZEN BOND protocol (Layer 1). This film package implements
# its MissionProvider. Relative path (fleet convention, as in ../bond-goldfinger):
# the BOND packages are checked out as siblings, so this resolves on any machine.
[tool.uv.sources]
bond-api = { path = "../bond-api" }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# We only calculate coverage for primary source code (`src/`), ensuring test
# code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate; the live coverage % is reported by the
# gate run (recorded locally under the gitignored docs/_generated/, do not
# hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Project-local mypy settings (the monorepo root config has no mypy_path for
# this package's src/ layout). Mirrors the BOND-API gate: strict-ish typing,
# explicit package bases, ignore missing stubs.
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.uv]
# Standalone package repo: no workspace root, so nothing is inherited here.
